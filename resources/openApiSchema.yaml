openapi: 3.0.4
info:
  title: SpendCraft API
  version: 0.1.0
  description: |
    ## Response contract

    The `/api/v1/*` endpoints use `application/json` with the lightweight SpendCraft API envelope.
    Shared response types are defined in `common/ResponseTypes.ts`.

    Successful responses containing data use `{ "data": ... }`. The data may be an object,
    collection or report matrix, according to the endpoint. Successful commands without response
    data return HTTP 204 with no body; clients should not attempt to parse a JSON body for them.

    Failures use the appropriate HTTP error status and an `errors` array:

    ```json
    {
      "errors": [
        { "message": "Amount is required", "field": "amount", "rule": "required" }
      ]
    }
    ```

    Each error requires a human-readable `message`. Optional fields are:

    - `field`: the input field path, including concrete array indexes such as `categories.0.amount`.
    - `rule`: the failed Vine validation rule.
    - `code`: an application or framework identifier, such as `INCORRECT_VERSION`.
    - `meta` and `index`: additional validation metadata when supplied by Vine.

    Validation failures return HTTP 422. General errors need not identify a field or rule.
    HTTP status is carried by the response, not repeated inside error objects. Unexpected server
    failures return a generic message while diagnostic details remain in server-side reporting.

    ## Monetary values

    Monetary amounts use `DecimalMoneyString`: canonical two-decimal strings such as `"12.50"`,
    `"-0.30"` and `"0.00"`. Percentage-mode values, interest rates, IDs and counts remain numeric
    where defined by their endpoint types. Plaid diagnostic payloads retain provider data types.

    ## Intentional exceptions

    - Browser pages, including email-verification pages, return HTML.
    - Webhook acknowledgments follow their provider contract; successful `/wh` requests return
      HTTP 204 without a response envelope.
    - `/vapidPublicKey`, outside `/api/v1`, returns the raw public-key string expected by its client.

paths:
  /api/v1/register:
    post:
      summary: Registers a user
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
        
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/groups:
    post:
      summary: Adds a group
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Group"
        "422":
          $ref: "#/components/responses/Error"
  
    get:
      summary: Gets the category tree
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/CategoryTree"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/groups/{id}:
    patch:
      summary: Updates a group
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Group"

        "422":
          $ref: "#/components/responses/Error"

    delete:
      summary: Deletes a group
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "204":
          description: OK
          content:
            application/json:
              schema:
                type: object

        "409":
          $ref: "#/components/responses/Error"

                
  /api/v1/groups/{id}/categories:
    post:
      summary: Add category
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Category"

  /api/v1/groups/{groupId}/categories/{catId}:
    patch:
      summary: Update category
      parameters:
        - in: path
          name: groupId
          schema:
            type: integer
          required: true
        - in: path
          name: catId
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Category"

    delete:
      summary: Delete category
      parameters:
        - in: path
          name: groupId
          schema:
            type: integer
          required: true
        - in: path
          name: catId
          schema:
            type: integer
          required: true
      responses:
        "204":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /api/v1/institution:
    post:
      summary: 'Add institution'
      responses:
        "200":
          $ref: "#/components/responses/AddAccountsResponse"

  /api/v1/institution/{accountId}/accounts:
    post:
      summary: 'Add acccount to institution'
      parameters:
        - in: path
          name: accountId
          schema:
            type: integer
          required: true
      responses:
        "200":
          $ref: "#/components/responses/AddOfflineAccountsResponse"

  /api/v1/account/{accountId}/balances:
    get:
      summary: Transaction-derived account chart points (no stored BalanceHistory)
      parameters:
        - in: path
          name: accountId
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Existing read-only series for transaction-tracked accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [date, balance]
                  properties:
                    date:
                      type: string
                      format: date
                    balance:
                      type: string
                      pattern: '^-?(?:0|[1-9][0-9]*)\.[0-9]{2}$'

components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            required:
              - errors
            properties:
              errors:
                type: array
                description: The errors
                items:
                  type: object
                  required: [message]
                  properties:
                    message:
                      type: string
                    field:
                      type: string
                    rule:
                      type: string
                    code:
                      type: string

    AddAccountsResponse:
      description: Add accounts response
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - id
                  - plaidInstitutionId
                  - name
                  - syncDate
                  - accounts
                  - categories
                properties:
                  id:
                    type: integer
                  plaidInstitutionId:
                    type: string
                    nullable: true
                  name: 
                    type: string
                  syncDate:
                    type: string
                    nullable: true
                    format: date-time
                  Accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/CategoryBalance"

    AddOfflineAccountsResponse:
      description: Add accounts response
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - account
                  - categories
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/CategoryBalance"

  schemas:
    Group:
      type: object
      required:
        - name
        - type
        - id
      description: The data
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - REGULAR
            - SYSTEM
            - NO GROUP
            - BILLS
        id:
          type: integer
        hidden:
          type: boolean
        parentGroupId:
          type: integer
          nullable: true

    Category:
      type: object
      required:
        - id
        - groupId
        - name
        - balance
        - type
      properties:
        id:
          type: integer
        groupId:
          type: integer
        name:
          type: string
        balance:
          type: string
          pattern: '^-?(?:0|[1-9][0-9]*)\.[0-9]{2}$'
        type:
          type: string
          enum:
            - REGULAR
            - UNASSIGNED
            - FUNDING POOL
            - ACCOUNT TRANSFER
        hidden:
          type: boolean
        fundingAmount:
          type: string
          pattern: '^-?(?:0|[1-9][0-9]*)\.[0-9]{2}$'
        useGoal:
          type: boolean
        recurrence:
          type: number
        fundingCategories:
          type: array
          items:
            type: object
        goalDate:
          type: string
          nullable: true
          format: date
        includeFundingTransfers:
          type: boolean
        suspended:
          type: boolean

    CategoryTree:
      type: object
      required:
        - categories
        - groups
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        groups:
          type: array
          items: 
            $ref: "#/components/schemas/Group"

    CategoryBalance:
      type: object
      required:
        - id
        - balance
      properties:
        id:
          type: integer
        balance:
          type: string
          pattern: '^-?(?:0|[1-9][0-9]*)\.[0-9]{2}$'

    Account:
      type: object
      required:
        - id
        - plaidId
        - name
        - type
        - subtype
        - closed
        - tracking
        - balance
      properties:
        id:
          type: integer
        plaidId:
          type: string
          nullable: true
        name:
          type: string
        type:
          type: string
          enum:
            - depository
            - credit
            - loan
            - investment
            - other
        subtype:
          type: string
        closed:
          type: boolean
        tracking:
          type: string
          enum:
            - None
            - Balances
            - Transactions
            - Uncategorized Transactions
        balance:
          type: string
          pattern: '^-?(?:0|[1-9][0-9]*)\.[0-9]{2}$'
        plaidBalance:
          nullable: true
          type: string
          pattern: '^-?(?:0|[1-9][0-9]*)\.[0-9]{2}$'
        startDate:
          type: string
          format: date
        rate:
          type: number


